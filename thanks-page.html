    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700&display=swap');

        :root {
            --orange: #f5a118;
            --yellow: #fac203;
            --black: #0a0a0a;
            --dark: #111111;
            --card: #161616;
            --border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --muted: rgba(255,255,255,0.5);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            background: var(--black);
            color: var(--text);
            font-family: 'Montserrat Alternates', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glow background */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245,161,24,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Diagonal grid texture */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(
                135deg,
                rgba(245,161,24,0.03) 0px,
                rgba(245,161,24,0.03) 1px,
                transparent 1px,
                transparent 40px
            );
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
        }

        /* ── TOP BADGE ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245,161,24,0.1);
            border: 1px solid rgba(245,161,24,0.25);
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--orange);
            animation: fadeDown 0.6s ease both;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--orange);
            animation: pulse 2s ease infinite;
        }

        /* ── HERO TEXT ── */
        .hero {
            text-align: center;
            animation: fadeUp 0.7s 0.1s ease both;
        }

        .hero-title {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: clamp(36px, 8vw, 64px);
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fac203 0%, #f5a118 50%, #ff6b00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .hero-sub {
            font-size: 15px;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.7;
            max-width: 400px;
            margin: 0 auto;
        }

        .hero-sub strong {
            color: var(--text);
            font-weight: 600;
        }

        /* ── DIVIDER ── */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245,161,24,0.3), transparent);
            animation: fadeUp 0.7s 0.2s ease both;
        }

        /* ── SOCIAL GRID ── */
        .social-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
            animation: fadeUp 0.7s 0.25s ease both;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            animation: fadeUp 0.7s 0.3s ease both;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-family: 'Montserrat Alternates', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .social-btn:hover::before { opacity: 1; }
        .social-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
        }

        .social-btn i {
            font-size: 16px;
            flex-shrink: 0;
        }

        /* Platform colors */
        .btn-instagram::before { background: linear-gradient(135deg, rgba(240,148,51,0.15), rgba(220,39,67,0.15), rgba(188,24,136,0.15)); }
        .btn-instagram:hover { border-color: rgba(220,39,67,0.4); }
        .btn-instagram i { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .btn-facebook::before { background: rgba(24,119,242,0.1); }
        .btn-facebook:hover { border-color: rgba(24,119,242,0.4); }
        .btn-facebook i { color: #1877f2; }

        .btn-telegram::before { background: rgba(34,158,217,0.1); }
        .btn-telegram:hover { border-color: rgba(34,158,217,0.4); }
        .btn-telegram i { color: #229ed9; }

        .btn-tiktok::before { background: rgba(255,255,255,0.04); }
        .btn-tiktok:hover { border-color: rgba(255,255,255,0.2); }

        .btn-video {
            grid-column: 1 / -1;
        }
        .btn-video::before { background: linear-gradient(135deg, rgba(166,75,244,0.1), rgba(255,79,216,0.1)); }
        .btn-video:hover { border-color: rgba(166,75,244,0.4); }
        .btn-video i { background: linear-gradient(45deg, #a64bf4, #ff4fd8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* ── BACK BUTTON ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
            animation: fadeUp 0.7s 0.4s ease both;
        }

        .back-btn:hover { color: var(--text); }

        .back-btn i {
            font-size: 11px;
            transition: transform 0.2s ease;
        }

        .back-btn:hover i { transform: translateX(-3px); }

        /* ── ANIMATIONS ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        /* ── MOBILE ── */
        @media (max-width: 420px) {
            body { padding: 32px 16px; }

            .social-grid { grid-template-columns: 1fr; }

            .btn-video { grid-column: 1; }

            .hero-title { font-size: 36px; }
        }
    </style>
</head>
